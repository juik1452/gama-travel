<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 深邃科技感漸層背景 -->
    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="50%"  stop-color="#0c1640"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>

    <!-- 機身光暈 -->
    <filter id="softglow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 細節光暈（軌跡線、引擎） -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 軌跡線漸層 -->
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 地球輪廓線（科技感） -->
  <g opacity="0.13" stroke="#60a5fa" stroke-width="1.5" fill="none">
    <circle cx="256" cy="215" r="158"/>
    <ellipse cx="256" cy="215" rx="79" ry="158"/>
    <line x1="98" y1="215" x2="414" y2="215"/>
    <line x1="256" y1="57"  x2="256" y2="373"/>
  </g>

  <!-- 速度軌跡線（飛機尾部方向，左下延伸） -->
  <g filter="url(#glow)">
    <line x1="108" y1="332" x2="198" y2="266"
          stroke="url(#trailGrad)" stroke-width="3" stroke-linecap="round" opacity="0.80"/>
    <line x1="122" y1="352" x2="194" y2="298"
          stroke="url(#trailGrad)" stroke-width="2" stroke-linecap="round" opacity="0.50"/>
    <line x1="140" y1="370" x2="191" y2="328"
          stroke="url(#trailGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.28"/>
  </g>

  <!-- 飛機本體（俯視圖，朝東北方向飛行） -->
  <!-- translate(265,208) rotate(45) → 機頭在右上，機尾在左下 -->
  <g transform="translate(265,208) rotate(45)" filter="url(#softglow)">
    <!-- 機身 -->
    <path d="M 0,-86 C 16,-66 16,54 0,80 C -16,54 -16,-66 0,-86 Z" fill="white"/>
    <!-- 左翼 -->
    <path d="M -13,4 L -102,52 L -13,67 Z" fill="white"/>
    <!-- 右翼 -->
    <path d="M  13,4 L  102,52 L  13,67 Z" fill="white"/>
    <!-- 左引擎（青色） -->
    <ellipse cx="-56" cy="37" rx="14" ry="6.5" fill="#00d4ff"/>
    <!-- 右引擎（青色） -->
    <ellipse cx=" 56" cy="37" rx="14" ry="6.5" fill="#00d4ff"/>
    <!-- 左尾翼 -->
    <path d="M  -9,62 L -30,84 L  -9,78 Z" fill="#00d4ff"/>
    <!-- 右尾翼 -->
    <path d="M   9,62 L  30,84 L   9,78 Z" fill="#00d4ff"/>
  </g>

  <!-- 機頭亮點 -->
  <circle cx="325" cy="147" r="5" fill="#00d4ff" opacity="0.90" filter="url(#glow)"/>

  <!-- 差旅 文字 -->
  <text x="256" y="432"
        font-size="74" text-anchor="middle"
        font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif"
        fill="white" font-weight="700" letter-spacing="8">差旅</text>

  <!-- 文字下方青色底線 -->
  <line x1="182" y1="449" x2="330" y2="449"
        stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"
        opacity="0.65" filter="url(#glow)"/>
</svg>
