<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景：深藍圓角方形，圓角更俐落 -->
  <rect width="512" height="512" rx="96" fill="#1e3560"/>
  <!-- 紙飛機（send icon），與 UI 一致的線條風格 -->
  <!-- 原始 24x24 路徑，放大 11 倍，置中於 (256, 210) -->
  <!-- M22 2 L11 13 → M366 110 L245 231 -->
  <!-- M22 2 L15 22 L11 13 L2 9 Z → M366 110 L289 330 L245 231 L146 187 Z -->
  <g stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="366" y1="110" x2="245" y2="231"/>
    <polygon points="366,110 289,330 245,231 146,187" fill="white" stroke="white" stroke-width="10"/>
  </g>
  <!-- 差旅文字 -->
  <text x="256" y="456" font-size="72" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        fill="white" font-weight="700" letter-spacing="6">差旅</text>
</svg>
